<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CNC Builder AI</title>
<style>
:root{--bg:#f4f6f8;--cd:#fff;--tx:#17202b;--mu:#667085;--ac:#0b6e6e;--bd:#dde2e8;--wn:#b54708;--ok:#067647;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161b;--cd:#1a2027;--tx:#e8ecf1;--mu:#98a2b3;--ac:#3fc1b8;--bd:#2c353f;--wn:#f79009;--ok:#32d583;--bad:#f97066}}
:root[data-theme="dark"]{--bg:#11161b;--cd:#1a2027;--tx:#e8ecf1;--mu:#98a2b3;--ac:#3fc1b8;--bd:#2c353f;--wn:#f79009;--ok:#32d583;--bad:#f97066}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--cd);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 8px}small,.mu{color:var(--mu)}
main{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px;max-width:1300px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;min-width:0}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mu)}
input,select,button{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;margin-top:8px}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.r2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.tabs button{width:auto;margin:0;padding:6px 12px;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:top}th{color:var(--mu);font-weight:600}
.k{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}.ok{color:var(--ok)}.warn{color:var(--wn)}.bad{color:var(--bad)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.st{padding:10px;border:1px solid var(--bd);border-radius:8px}.st b{display:block;font-size:19px}
canvas{width:100%;height:380px;display:block;border-radius:8px;background:var(--bg);touch-action:none;cursor:grab}
a{color:var(--ac)}
</style></head><body>
<header><h1 id="ttl">CNC Builder AI</h1><div style="width:200px"><button class="g" id="lb" style="margin:0">English</button></div></header>
<main>
<section class="cd"><h2 id="h_in"></h2>
<label id="l_ty"></label><select id="ty"></select>
<div class="r2"><div><label id="l_x"></label><input id="x" type="number" value="40" min="10" max="200"></div><div><label id="l_y"></label><input id="y" type="number" value="40" min="10" max="200"></div><div><label id="l_z"></label><input id="z" type="number" value="10" min="2" max="40"></div></div>
<label id="l_mt"></label><select id="mt"></select>
<label id="l_bd"></label><input id="bd" type="number" value="2500" min="0">
<label id="l_ti"></label><select id="ti"></select>
<button id="sv"></button><label id="l_ld"></label><select id="ld"></select><button class="g" id="lo"></button>
<p class="mu" id="nt" style="font-size:12px"></p></section>
<section><div class="tabs" id="tabs"></div><div class="cd" id="out"></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";
const $=i=>document.getElementById(i);let lang='ar',tab='sum',RES=null,paper='A3';
const D={ar:{ttl:'CNC Builder AI — منصة تصميم مكائن CNC',h_in:'مواصفات الماكينة',l_ty:'نوع الماكينة',l_x:'عرض X (سم)',l_y:'عمق Y (سم)',l_z:'مشوار Z (سم)',l_mt:'المادة',l_bd:'الميزانية (ريال)',l_ti:'الفئة',sv:'حفظ المشروع',l_ld:'مشاريع محفوظة',lo:'فتح المشروع',
nt:'الأسعار المعروضة تقديرية من جدول داخلي وليست أسعار AliExpress الحية. روابط الشراء هي روابط بحث فقط، والسعر والتوفر غير متحققين.',
sum:'الملخص',v3:'3D',bom:'قائمة القطع',cmp:'المقارنة',chk:'الفحوصات',exp:'التصدير',lib:'المراجع',
types:{router:'CNC Router خشب/أكريليك',mill:'CNC Milling ألمنيوم',engrave:'CNC نقش',pcb:'PCB Milling',plotter:'CNC Plotter',laser:'CNC Laser'},
mats:{wood:'خشب',acrylic:'أكريليك',alu:'ألمنيوم',pcb:'PCB'},tiers:{eco:'اقتصادي',bal:'متوازن',pro:'احترافي'}},
en:{ttl:'CNC Builder AI — CNC Machine Design Platform',h_in:'Machine specs',l_ty:'Machine type',l_x:'X width (cm)',l_y:'Y depth (cm)',l_z:'Z travel (cm)',l_mt:'Material',l_bd:'Budget (SAR)',l_ti:'Build tier',sv:'Save project',l_ld:'Saved projects',lo:'Open project',
nt:'Prices are estimates from an internal table, not live AliExpress prices. Purchase links are search links only; price and stock are unverified.',
sum:'Summary',v3:'3D',bom:'BOM',cmp:'Compare',chk:'Checks',exp:'Export',lib:'References',
types:{router:'CNC Router (wood/acrylic)',mill:'CNC Milling (aluminum)',engrave:'CNC Engraving',pcb:'PCB Milling',plotter:'CNC Plotter',laser:'CNC Laser'},mats:{wood:'Wood',acrylic:'Acrylic',alu:'Aluminum',pcb:'PCB'},tiers:{eco:'Economic',bal:'Balanced',pro:'Professional'}}};
const T=k=>D[lang][k]||k,P=(a)=>lang=='ar'?a[0]:a[1],c10=v=>Math.ceil(v/10)*10,rd=(v,n=1)=>Math.round(v*10**n)/10**n;
const PROF=[{n:'2020',w:20,kg:.5,I:5e3,p:9},{n:'2040',w:20,kg:.8,I:2e4,p:15},{n:'4040',w:40,kg:1.5,I:9e4,p:28},{n:'4080',w:40,kg:2.7,I:3e5,p:50},{n:'6060',w:60,kg:3.5,I:4.5e5,p:70},{n:'8080',w:80,kg:6,I:1.5e6,p:110}];
const RAIL={SBR16:{bl:45,w:50,pm:35,pb:25},MGN9:{bl:30,w:20,pm:45,pb:30},MGN12:{bl:45,w:27,pm:60,pb:40},MGN15:{bl:61,w:34,pm:90,pb:55},HGR15:{bl:61,w:34,pm:95,pb:60},HGR20:{bl:77,w:44,pm:130,pb:85},HGR25:{bl:84,w:48,pm:180,pb:120}};
const SCR={T8:{lead:8,r:6.2,eff:.4,a:12,b:.3,sup:'KP08 + KFL08',sp:35},SFU1204:{lead:4,r:9.9,eff:.9,a:90,b:.6,sup:'BK10 + BF10',sp:45},SFU1605:{lead:5,r:13.2,eff:.9,a:150,b:.9,sup:'BK12 + BF12',sp:55},GT2:{lead:40,r:0,eff:.9,a:0,b:0,sup:'',sp:0}};
const MOT=[{n:'NEMA 17 (1.7A, 0.45 N·m)',h:.45,I:1.7,V:24,p:55,dr:['TB6600 4A',55]},{n:'NEMA 23 (3A, 1.9 N·m)',h:1.9,I:3,V:24,p:130,dr:['DM542 4.2A',110]},{n:'NEMA 24 (4.2A, 3.1 N·m)',h:3.1,I:4.2,V:36,p:190,dr:['DM556 5.6A',130]},{n:'NEMA 34 (6A, 8.5 N·m)',h:8.5,I:6,V:48,p:330,dr:['DM860T 7.2A',190]}];
const SPN={router:[['300W DC spindle ER11',300,1.3,150,0],['800W water-cooled spindle ER11',800,2.3,330,1],['1.5kW water-cooled spindle ER16',1500,4.5,750,1]],mill:[['800W water-cooled spindle ER11',800,2.3,330,1],['1.5kW water-cooled spindle ER16',1500,4.5,750,1],['2.2kW water-cooled spindle ER20',2200,6,1100,1]],engrave:[['100W DC spindle ER11',100,.8,90,0],['300W DC spindle ER11',300,1.3,150,0],['300W DC spindle ER11',300,1.3,150,0]],pcb:[['100W DC spindle ER11',100,.8,90,0],['300W DC spindle ER11',300,1.3,150,0],['300W DC spindle ER11',300,1.3,150,0]],plotter:[['Servo pen lifter + holder',0,.2,25,0],['Servo pen lifter + holder',0,.2,25,0],['Servo pen lifter + holder',0,.2,25,0]],laser:[['5W laser module + air assist',0,.6,350,0],['10W laser module + air assist',0,.8,700,0],['20W laser module + air assist',0,1.2,1400,0]]};

function calc(p,tier){
const X=p.x*10,Y=p.y*10,Z=p.z*10,ty=p.type,mx=Math.max(X,Y),ti=['eco','bal','pro'].indexOf(tier),light=['plotter','laser','pcb'].includes(ty);
const Fc=ty=='plotter'?3:ty=='laser'?0:({wood:60,acrylic:50,alu:150,pcb:15}[p.mat]||60);
const S=SPN[ty][ti],sp={n:S[0],W:S[1],kg:S[2],p:S[3],cool:S[4]};
const rail=light?['MGN9','MGN12','MGN15'][ti]:ty=='mill'?['HGR15','HGR20','HGR25'][ti]:['SBR16',mx<=500?'MGN15':'HGR15',mx>800?'HGR25':'HGR20'][ti];
const scn=light?'GT2':ty=='mill'?['SFU1204','SFU1605','SFU1605'][ti]:['T8','SFU1204','SFU1605'][ti],zs=light?'T8':scn;
const R=RAIL[rail],bl=R.bl;
let pi=mx<=250?0:mx<=450?1:mx<=650?2:mx<=900?3:5;if(ty=='mill')pi=Math.max(pi,2);pi=Math.min(5,pi+(ti==2?1:0));if(pi==4)pi=5;
const PF=PROF[pi],pw=PF.w;
const gd=Math.max(120,2*bl+40),yr=c10(Y+gd+30),zw=bl+70,xr=c10(X+zw+30),zr=c10(Z+bl+60);
const outX=c10(xr+2*(12+R.w+pw)),outY=yr+40,gH=Z+220,H=pw+gH,beamL=xr+60;
const feedT=[1500,3000,5000][ti],dual=X>=600;
const ax=[{k:'X',tr:X,m:1.5+sp.kg+X/400,gr:0,n:1,sc:scn},{k:'Y',tr:Y,m:3+X/150+sp.kg,gr:0,n:dual?2:1,sc:scn},{k:'Z',tr:Z,m:.5+sp.kg,gr:1,n:1,sc:zs}];
const parts=[],checks=[],add=(g,n,spec,q,u,why,s)=>parts.push({g,n,spec,q,u,why,s:s||n});
let motors=0,maxV=24,sumI=0;
ax.forEach(a=>{const sc=SCR[a.sc],F=(Fc+a.m*(a.gr?10.8:1.2))/a.n,Tr=F*sc.lead/1000/(2*Math.PI*sc.eff),need=3*Tr;
 let m=MOT.find(o=>o.h>=need),okm=!!m;if(!m)m=MOT[3];a.mot=m;a.F=F;a.T=Tr;a.need=need;a.okm=okm;a.L=a.tr+120;
 if(sc.r){const nc=18.7*sc.r*1e7/(a.L*a.L);a.nc=nc;a.maxF=.8*nc*sc.lead;a.okc=a.maxF>=feedT}else{a.maxF=1e9;a.okc=true}
 motors+=a.n;maxV=Math.max(maxV,m.V);sumI+=m.I*a.n;
 checks.push({s:okm?'ok':'bad',t:[`محور ${a.k}: عزم لازم ≈ ${rd(need,2)} N·m (مع معامل أمان 1.5 وخصم 50% عند السرعة) — المحرك ${m.n.split(' (')[0]} ${okm?'كافٍ':'غير كافٍ، يلزم Servo/محرك أكبر'}`,`${a.k} axis: required holding torque ≈ ${rd(need,2)} N·m (SF 1.5, 50% speed derate) — ${m.n.split(' (')[0]} ${okm?'sufficient':'insufficient, needs servo/larger motor'}`]});
 if(sc.r)checks.push({s:a.okc?'ok':'warn',t:[`محور ${a.k}: السرعة الحرجة للبرغي ≈ ${Math.round(a.maxF)} مم/د (الهدف ${feedT})${a.okc?'':' — قلّل السرعة السريعة'}`,`${a.k} axis: screw critical-speed feed limit ≈ ${Math.round(a.maxF)} mm/min (target ${feedT})${a.okc?'':' — lower rapid feed'}`]});});
// frame
const cuts=[['Base long (Y)',2,outY],['Base cross (X)',2,outX-2*pw],['Gantry uprights',2,gH],['Gantry beam',1,beamL]],profLen=cuts.reduce((s,c)=>s+c[1]*c[2],0),br=12;
const dfl=Fc*Math.pow(xr,3)/(48*70000*PF.I),dl=[.08,.05,.03][ti];
checks.push({s:dfl<=dl?'ok':'warn',t:[`انحراف الجسر (الشعاع فقط، تقدير تقريبي ±50%): ${rd(dfl,3)} مم مقابل حد ${dl} مم`,`Gantry beam deflection (beam only, rough ±50%): ${rd(dfl,3)} mm vs limit ${dl} mm`]});
add('M',`Aluminum extrusion ${PF.n}`,`${rd(profLen/1000,2)} m total (cut list in Summary)`,Math.ceil(profLen/1000*10)/10,PF.p*1000/1000,['حجم القطاع مبني على أكبر بُعد وحمل الجسر','Section chosen from largest dimension and gantry load'],`aluminum profile ${PF.n} T-slot`);
add('M',`Angle brackets + T-nuts (${PF.n})`,'M5/M6 sets',br,4,['وصلات الهيكل: 4 زوايا للقاعدة + 4 للأعمدة + 4 للجسر','Frame joints: 4 base, 4 uprights, 4 beam'],`corner bracket ${PF.n} t-nut`);
const rl=[['X',xr],['Y',yr],['Z',zr]];rl.forEach(([k,l])=>add('M',`${rail} linear rail ${k} (×2)`,`${l} mm each + 2 blocks per rail`,2,rd(R.pm*l/1000+2*R.pb,0),['مسطرتان لكل محور لمنع الالتواء؛ الطول = المشوار + طول العربة + هامش','Two rails per axis for stiffness; length = travel + carriage + margin'],`${rail} linear guide ${l}mm with block`));
ax.forEach(a=>{const sc=SCR[a.sc],nm=a.sc;
 if(nm=='GT2'){add('M',`GT2 belt axis ${a.k}`,`${2*a.tr+300} mm, 20T pulleys + idlers`,1,40,['سير لخفة الحمل وسرعة أعلى','Belt for light load and speed'],'GT2 belt 6mm 20T pulley idler kit')}
 else{add('M',`${nm} screw + nut axis ${a.k}`,`${a.L} mm`,a.n,rd(sc.a+sc.b*a.L/10,0),[`الخطوة ${sc.lead} مم/دورة، الطول = المشوار+120`,`Lead ${sc.lead} mm/rev, length = travel + 120`],`${nm} lead screw ${a.L}mm nut`);add('M',`Screw supports ${sc.sup}`,`axis ${a.k}`,a.n,sc.sp*2,['جهة ثابتة وجهة حرة','Fixed + floating end'],sc.sup+' screw support');add('M','Flexible coupling',`axis ${a.k}`,a.n,15,['يمتص عدم المحاذاة','Absorbs misalignment'],'flexible coupling shaft')}
 add('E',a.mot.n,`axis ${a.k}`,a.n,a.mot.p,[`عزم محسوب ${rd(a.need,2)} N·m`,`Computed torque ${rd(a.need,2)} N·m`],a.mot.n.split(' (')[0]+' stepper motor');add('E',`Driver ${a.mot.dr[0]}`,`axis ${a.k}`,a.n,a.mot.dr[1],['يطابق تيار المحرك','Matches motor current'],a.mot.dr[0]+' stepper driver');});
const zp=zw*zr,gp=gd*gH,pr=(ar,t)=>rd(ar*t*2.7e-6*35,0);
add('M','Aluminum 6061 gantry side plates 12 mm',`${gd}×${gH} mm`,2,pr(gp,12),['اللوحان الجانبيان؛ السماكة غير محققة هندسيًا','Side plates; thickness not structurally verified'],'6061 aluminum plate 12mm CNC cut');
add('M','Aluminum Z-carriage plate 10 mm',`${zw}×${zr} mm`,1,pr(zp,10),['حامل المغزل','Spindle carrier'],'6061 aluminum plate 10mm');
add('M','Motor mount plates 8 mm',`${motors} pcs`,motors,25,['حوامل مخصصة للمحركات','Custom motor mounts'],'NEMA motor mount bracket');
add('M','Spoilboard / bed (MDF 18 mm)',`${X}×${Y} mm`,1,45,['سطح التشغيل','Work bed'],'MDF board');
add('M','Cable chain',`${Math.ceil((X+Y+Z)/1000*10)/10} m`,1,Math.round(22*(X+Y+Z)/1000+20),['حماية الكابلات','Cable protection'],'cable drag chain 15x30');
add('M',`Spindle mount / ${sp.n.split(' ')[0]} clamp`,'',1,40,['تثبيت المغزل','Spindle clamp'],'spindle mount clamp');
add('M',sp.n,`${sp.W} W`,1,sp.p,[ty=='mill'?'التفريز يحتاج صلابة أعلى؛ القدرة الأعلى ليست دائمًا أفضل':'القدرة حسب المادة وحجم الهيكل','Power matched to material and frame; more power is not always better'],sp.n);
if(sp.cool)add('M','Water cooling kit','pump + tubing',1,70,['تبريد المغزل','Spindle cooling'],'spindle water cooling pump kit');
if(sp.W>=1500)add('E','VFD '+(sp.W>=2200?'2.2kW':'1.5kW'),'220V',1,sp.W>=2200?500:400,['مشغّل للمغزل المتزامن','Spindle drive'],'VFD 1.5kw spindle');else if(sp.W>0)add('E','Spindle PSU + speed controller',`${sp.W} W`,1,90,['تغذية المغزل DC','DC spindle supply'],'DC spindle power supply speed controller');
const ctl=['Arduino CNC shield (GRBL)','MKS DLC32 / ESP32 (FluidNC)','4-axis motion controller (grblHAL/Mach3)'][ti];
add('E',ctl,'4-axis',1,[60,110,260][ti],['وحدة التحكم حسب الفئة','Controller by tier'],ctl);
const Pw=sumI*maxV*.6*1.3,psuW=[150,240,350,480,600,800,1000].find(v=>v>=Pw)||1000;
add('E',`PSU ${maxV}V ${psuW}W`,'DC',1,Math.round(psuW*.35+30),[`تقدير الحمل ≈ ${Math.round(Pw)}W مع هامش 30%`,`Load ≈ ${Math.round(Pw)} W with 30% margin`],`${maxV}V ${psuW}W switching power supply`);
checks.push({s:'ok',t:[`مصدر الطاقة ${maxV}V / ${psuW}W مناسب لتقدير الحمل ${Math.round(Pw)}W`,`PSU ${maxV}V / ${psuW}W covers estimated ${Math.round(Pw)} W`]});
add('E','Limit switches',`${dual?4:3} pcs`,dual?4:3,8,['حدود المحاور','Axis end-stops'],'limit switch CNC');
add('E','Emergency stop + contactor','NC mushroom',1,45,['دائرة إيقاف طارئ','Emergency stop circuit'],'emergency stop button contactor');
add('E','Fuse / breaker + grounding set','',1,40,['حماية وتأريض','Protection and grounding'],'din rail circuit breaker');
add('E','Shielded cable + connectors',`${Math.ceil((X+Y+Z)/1000*2+8)} m`,1,70,['كابلات محركات ومفاتيح','Motor and switch cabling'],'shielded stepper motor cable 4 core');
add('E','Electrical enclosure','',1,80,['صندوق للإلكترونيات','Electronics housing'],'electrical enclosure box');
add('M','Fastener kit','M3–M8',1,60,['مسامير وصواميل','Screws and nuts'],'M5 M6 screw nut kit');
add('S','GRBL / FluidNC / grblHAL','free',1,0,['برمجيات تحكم مفتوحة المصدر','Open-source firmware'],'');
const sub=parts.reduce((s,p)=>s+p.q*p.u,0),ship=sub*.15,total=sub+ship;
checks.push({s:total<=p.bd?'ok':'bad',t:[`التكلفة التقديرية ${Math.round(total)} ريال (شحن/رسوم 15% افتراضي غير محقق) مقابل ميزانية ${p.bd}`,`Estimated cost ${Math.round(total)} SAR (15% placeholder for shipping/duties, unverified) vs budget ${p.bd}`]});
if(ty=='mill'&&ti==0)checks.push({s:'warn',t:['تفريز الألمنيوم بفئة اقتصادية: الصلابة محدودة، استخدم أعماق قطع صغيرة','Aluminum milling on economic tier: limited rigidity, use shallow cuts']});
if(ty=='laser')checks.push({s:'warn',t:['الليزر يتطلب حاجزًا مغلقًا ونظارات وقفل أمان — غير مشمول في القائمة','Laser needs enclosure, goggles, interlock — not in BOM']});
checks.push({s:'warn',t:['كشف التصادم والتحليل الإنشائي الكامل والتحقق الهندسي لم تُنفَّذ؛ يلزم مراجعة مهندس','Collision detection, full FEA and engineer review not performed']});
const mass=profLen/1000*PF.kg+(2*gp*12+zp*10)*2.7e-6+motors*(1)+sp.kg+4;
return{parts,checks,sub,ship,total,rail,scn,PF,sp,ax,cuts,profLen,outX,outY,H,xr,yr,zr,gd,gH,zw,beamL,pw,rw:R.w,dfl,mass,status:checks.some(c=>c.s=='bad')?'Validation Required':'Calculated',feedT,motors,X,Y,Z,tier}}

function inp(){return{type:$('ty').value,x:+$('x').value||40,y:+$('y').value||40,z:+$('z').value||10,mat:$('mt').value,bd:+$('bd').value||0,tier:$('ti').value}}
function run(){const p=inp();RES={p,all:{eco:calc(p,'eco'),bal:calc(p,'bal'),pro:calc(p,'pro')}};RES.r=RES.all[p.tier];show()}

  a.href=url;a.download=n;document.body.appendChild(a);a.click();a.remove();

 }catch(e){if(m)m.textContent='Download failed: '+(e&&e.message||e)}
}
